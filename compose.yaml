services:
    db:
        image: postgis/postgis:18-3.7-alpine
        container_name: motok-db
        restart: always
        environment:
            POSTGRES_USER: ${DB_USER:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
            POSTGRES_DB: ${DB_NAME:-motok}
        volumes:
            - pgdata:/var/lib/postgresql
        ports:
            - "5432:5432"

volumes:
    pgdata: